name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Run tests
        run: dotnet test --configuration Release --no-restore --logger console

      - name: Publish Blazor WASM
        run: dotnet publish src/CultSimulator/CultSimulator.csproj -c Release -o release --no-restore

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cult-simulator-build
          path: release/wwwroot
